name: Release gem

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vX.Y.Z tag to publish
        required: true
        type: string

concurrency:
  group: prdigest-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact tagged gem
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vX.Y.Z" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Verify tag and package version
        shell: bash
        run: |
          gem_version="$(bundle exec ruby -Ilib -rprdigest/version -e 'print Prdigest::VERSION')"
          test "v${gem_version}" = "$RELEASE_TAG"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          echo "GEM_VERSION=${gem_version}" >> "$GITHUB_ENV"

      - name: Test tagged source
        run: bundle exec rake test

      - name: Smoke-test clean gem install
        run: test/smoke/gem_install.sh

      - name: Build exact gem
        run: bundle exec rake build

      - name: Verify built artifact
        shell: bash
        run: |
          artifact="pkg/prdigest-${GEM_VERSION}.gem"
          test -f "$artifact"
          built_version="$(ruby -rrubygems/package -e 'print Gem::Package.new(ARGV.fetch(0)).spec.version' "$artifact")"
          test "$built_version" = "$GEM_VERSION"

      - name: Configure short-lived RubyGems credentials
        id: credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a

      - name: Diagnose rejected publisher identity
        if: failure() && steps.credentials.outcome == 'failure'
        shell: python
        run: |
          import base64, json, os, urllib.request, urllib.error
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=rubygems.org"
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          })
          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          safe = ["repository", "repository_owner_id", "environment", "job_workflow_ref", "workflow_ref", "ref", "aud"]
          print("Publisher identity: " + json.dumps({key: claims.get(key) for key in safe}))
          request = urllib.request.Request(
              "https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token",
              data=json.dumps({"jwt": token}).encode(),
              headers={"Content-Type": "application/json", "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(request) as response:
                  print("RubyGems exchange HTTP " + str(response.status))
          except urllib.error.HTTPError as error:
              print("RubyGems exchange HTTP " + str(error.code))
              print("Response content type: " + str(error.headers.get("Content-Type")))
              body = json.loads(error.read())
              for key in ("error", "message", "errors"):
                  if key in body:
                      message = json.dumps(body[key]).replace(token, "<redacted>")
                      message = message.replace(os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"], "<redacted>")
                      print("RubyGems " + key + ": " + message[:2000])

      - name: Publish exact gem
        run: gem push "pkg/prdigest-${GEM_VERSION}.gem"
